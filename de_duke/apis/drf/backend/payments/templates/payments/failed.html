<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | DeDuke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --error: #ef4444;
            --error-light: #fee2e2;
            --secondary: #7f1d1d;
            --bg: #fcf8f8;
            --text: #1e293b;
            --white: #ffffff;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background: radial-gradient(circle at top right, #fff1f2 0%, #f8fafc 40%, #fef2f2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transform: translateY(0);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: var(--error-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative;
        }

        .error-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-icon svg {
            width: 100%;
            height: 100%;
            stroke: var(--error);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .x-mark__line1 {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.5s forwards;
        }

        .x-mark__line2 {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.7s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary);
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            border-radius: 1rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--error);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
        }

        .btn-primary:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
            color: var(--text);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Subtle shake animation for the container on load */
        .shake-on-load {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) 0.6s both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-3px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(3px, 0, 0);
            }
        }
    </style>
</head>

<body>
    <div class="container shake-on-load">
        <div class="icon-container">
            <div class="error-icon">
                <svg viewBox="0 0 52 52">
                    <circle cx="26" cy="26" r="25" style="stroke: var(--error); opacity: 0.2;" />
                    <line class="x-mark__line1" x1="16" y1="16" x2="36" y2="36" />
                    <line class="x-mark__line2" x1="36" y1="16" x2="16" y2="36" />
                </svg>
            </div>
        </div>
        <h1>Payment Failed</h1>
        <p>We're sorry, but your transaction could not be processed at this time. Please check your payment details and
            try again.</p>
        <br> <br>
        <p>Automatic redirection in 5 seconds.</p>
    </div>
</body>

</html>
